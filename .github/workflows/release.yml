name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native Windows executable
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Verify format, resources and safe failure
        shell: pwsh
        run: ./scripts/Verify.ps1
      - name: Package tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Package.ps1 -Version $env:RELEASE_TAG
      - name: Save verified build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Endfield-Launch-Proxy-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Endfield-Launch-Proxy-Windows-x64
          path: dist
      - name: Verify download and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = Get-Content -LiteralPath 'dist/SHA256SUMS.txt'
          foreach ($line in $lines) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw 'Invalid checksum manifest.' }
            $expected = $matches[1]
            $name = $matches[2]
            if ([IO.Path]::GetFileName($name) -cne $name) { throw 'Invalid checksum filename.' }
            $actual = (Get-FileHash -LiteralPath (Join-Path 'dist' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $expected) { throw "Checksum failed: $name" }
          }
          $expectedNames = @('明日方舟：终末地.exe', "EndfieldLaunchProxy-$env:RELEASE_TAG-windows-x64.zip", "EndfieldLaunchProxy-$env:RELEASE_TAG-source.zip", 'build-info.json', 'SHA256SUMS.txt')
          $foundNames = @(Get-ChildItem -LiteralPath 'dist' -File | ForEach-Object { $_.Name })
          if (Compare-Object $expectedNames $foundNames -CaseSensitive) { throw 'Unexpected release asset set.' }
          $assets = $expectedNames | ForEach-Object { Join-Path 'dist' $_ }
          gh release create $env:RELEASE_TAG --repo $env:GH_REPO --verify-tag --title "终末地启动代理 $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md @assets
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed: $LASTEXITCODE" }
